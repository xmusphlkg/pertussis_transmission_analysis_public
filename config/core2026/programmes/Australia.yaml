sensitivity_variants:
  australia_primary_product_1997_1999:
    description: Sensitivity for SA/NT early all-dose aP versus national booster-only
      transition.
    primary_product_start: '1999-01-01'
    operations:
    - kind: set_product_start
      product: aP
      start: '1999-01-01'
  australia_booster_18m_cutover:
    description: Sensitivity for recommendation March 2015 versus funded delivery
      March 2016.
    toddler_booster_start: '2015-03-01'
    operations:
    - kind: set_dose_field
      block: infant_doses
      name: booster_18m_reintroduced
      field: start
      value: '2015-03-01'
notes: 1990-1993 continuity and state-specific maternal dates remain provisional;
