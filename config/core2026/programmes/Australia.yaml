schema: core2026-programme-v1
country: Australia
iso3: AUS
status: provisional
sensitivity_priority: high
sources:
  wuenic_2025:
    citation: WHO/UNICEF Estimates of National Immunization Coverage, DTP1/DTP3, 2025
      revision; repository export used by core2026.
    url: https://immunizationdata.who.int/
    ledger: coverage_series_external_validation
  coverage_pre1990_assumption:
    citation: Modeling assumption for pre-1990 coverage where the M2 ledger has policy
      context but no annual national uptake series; replace when historical survey/registry
      data are assembled.
    url: data/processed/m2_vaccination_history/README.md
    ledger: coverage_pre_1990_open_item
  coverage_projection_2050:
    citation: Core2026 projection assumption after the last observed WUENIC year;
      held near the recent national level for forward simulation.
    url: config/core2026/programmes/README.md
    ledger: projection_assumption
  ledger_schedule:
    citation: 'M2 Australia ledger: national schedule and product-transition events.'
    url: data/processed/m2_vaccination_history/australia_brazil.md
    ledger: Australia event ledger
  ledger_gap:
    citation: 'M2 Australia ledger: September 2003 removal and March 2016 funded reintroduction
      of the 18-month booster.'
    url: data/processed/m2_vaccination_history/australia_brazil.md
    ledger: Australia 18-month booster gap
  ledger_maternal:
    citation: 'M2 Australia ledger: state programmes from 2013/2014-2015 and national
      NIP funding from 2018-07.'
    url: data/processed/m2_vaccination_history/australia_brazil.md
    ledger: Australia maternal programme
  timeliness_assumption:
    citation: Shared whole-month timeliness prior used for the core2026 input bundle;
      country-specific dose-date distributions are not yet available.
    url: config/core2026/programmes/README.md
    ledger: timeliness_open_item
