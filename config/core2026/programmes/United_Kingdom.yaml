sensitivity_variants:
  uk_primary_switch_month:
    description: September 2004 versus October 2004 source discrepancy.
    alternative_primary_product_start: '2004-10-01'
    operations:
    - kind: set_product_start
      product: aP
      start: '2004-10-01'
  uk_devolved_dates:
    description: Evidence is strongest for England and Wales; devolved nation dates
      require separate verification.
    operations: []
  uk_18m_birth_cohort:
    description: 18-month dose applies to children born on/after 2024-07-01; encoder
      starts the 18-month stream in January 2026. Delayed older cohorts remain
      an approximation in the monthly timeliness encoder.
    alternative: birth_cohort_exact
    operations: []
  uk_preschool_pre2001_with_pertussis:
    description: Sensitivity if the pre-2001 preschool booster included pertussis.
    operations:
    - kind: set_coverage_segment
      series: preschool
      from: 1970
      to: 2000
      value: 0.7
notes: UK profile is labelled United Kingdom but historical evidence is strongest
  for England and Wales; no routine adolescent pertussis dose is encoded.
