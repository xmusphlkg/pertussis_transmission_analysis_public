    description: 2005 10-year transition versus 2007 birth-cohort schedule; core uses
      non-overlapping calendar windows.
    alternative: birth_cohort_exact
    operations:
    - kind: set_birth_cohort
      block: cohort_doses
      name: booster_10y
      birth_year_start: 1995
      birth_year_end: 2002
  sweden_maternal_delivery:
    description: Recommendation is national but uptake/delivery is regional.
    coverage: regional_parameter
    operations: []
notes: 1979-1995 programme gap is explicit; WUENIC is used only from 1996 when pertussis-containing
  vaccination resumed.
