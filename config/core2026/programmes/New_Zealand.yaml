sensitivity_variants:
  new_zealand_product_switch:
    description: August 2000 national DTaP transition; exact cohort implementation
      remains a sensitivity.
    primary_product_start: '2000-08-01'
    operations:
    - kind: set_product_start
      product: aP
      start: '2000-08-01'
  new_zealand_15m_cutover:
    description: 15-month booster removed in 2006; grandfathering unresolved.
    end: '2006-01-01'
    operations:
    - kind: set_dose_field
      block: infant_doses
      name: booster_15m
      field: end
      value: '2006-01-01'
notes: 1958 versus 1960 early wording and 2000/2006/2008 cohort cutovers remain provisional.
