# core2026 parameter priors and fixed values.
#
# scope:     structural (transmission model) | observation (reporting model)
# estimated: true -> sampled/fitted per country; false -> fixed at `value`
# Distributions are on the natural scale:
#   lognormal: median, log_sd        beta: a, b        normal: mean, sd
#   uniform: lower, upper
# `bounds` are hard optimisation limits (finite support for the sampler).
# `sources` refer to keys under `references`; each reference carries a
# verification status so unverified citations are never presented as checked:
#   fulltext   - methods/results read during the 2026-10-16 literature survey
#   citation   - bibliographic record confirmed, numbers not re-read
#   author     - must be confirmed by the author before manuscript use

version: core2026-priors-v1

parameters:
  # --- Transmission -------------------------------------------------------
  R0:
    scope: structural
    estimated: true
    distribution: lognormal
    median: 8.0
    log_sd: 0.5
    bounds: [2.0, 30.0]
    note: >-
      Naive-population R0 with the reference-year total contact matrix.
      Published values depend strongly on model structure (about 2.4 with a
      separate breakthrough class in Brett 2026; 5.5 or more from serology and
      contacts; 12-17 classically), hence the wide prior.
    sources: [anderson_may_1991, kretzschmar_2010, brett_2026]
  seasonal_amplitude:
    scope: structural
    estimated: true
    distribution: beta
    a: 2.0
    b: 6.0
    bounds: [0.0, 0.6]
    sources: []
  seasonal_peak:
    scope: structural
    estimated: true
    distribution: normal
    mean: country      # set per country from the observed monthly profile
    sd: 0.15
    bounds: [-1.0, 2.0]
    note: Fraction of the calendar year; circular, so bounds only bracket it.
    sources: []
  npi_scale:
    scope: structural
    estimated: true
    distribution: lognormal
    median: 1.0
    log_sd: 0.35
    bounds: [0.1, 3.0]
    note: Multiplies the country NPI non-home contact reduction timeline.
    sources: []
  importation_per_million_per_year:
    scope: structural
    estimated: true
    distribution: lognormal
    median: 10.0
    log_sd: 2.3
    bounds: [0.01, 10000.0]
    sources: []
  rho_mild:
    scope: structural
    estimated: false
    value: 0.5
    sources: [choi_2016]

  # --- Natural history ---------------------------------------------------
  latent_days:
    scope: structural
    estimated: false
    value: 8.0
    sources: [korea_school_outbreak_2025]
  infectious_days_typical:
    scope: structural
    estimated: false
    value: 21.0
    sources: [lavine_2011]
  infectious_days_mild:
    scope: structural
    estimated: false
    value: 14.0
    sources: []

  # --- Immunity ----------------------------------------------------------
  natural_immunity_years:
    scope: structural
    estimated: true
    distribution: lognormal
    median: 30.0
    log_sd: 0.5
    bounds: [5.0, 150.0]
    note: Mean of R + W (Erlang-2).
    sources: [wearing_rohani_2009, wendelboe_2005, lavine_2013]
  boosting_kappa:
    scope: structural
    estimated: true
    distribution: lognormal
    median: 2.0
    log_sd: 0.8
    bounds: [0.05, 50.0]
    sources: [lavine_2011]
  wP_years:
    scope: structural
    estimated: true
    distribution: lognormal
    median: 10.0
    log_sd: 0.4
    bounds: [2.0, 50.0]
    sources: [wendelboe_2005, gambhir_2015]
  aP_years:
    scope: structural
    estimated: true
    distribution: lognormal
    median: 6.0
    log_sd: 0.45
    bounds: [1.0, 30.0]
    sources: [klein_2012, mcgirr_fisman_2015, choi_2026]
  tdap_years:
    scope: structural
    estimated: true
    distribution: lognormal
    median: 3.0
    log_sd: 0.45
    bounds: [0.5, 20.0]
    sources: [klein_2016, brett_2026]
  maternal_days:
    scope: structural
    estimated: false
    value: 90.0
    sources: [amirthalingam_2014]
  d1_protection_years:
    scope: structural
    estimated: false
    value: 1.0
    sources: []
  d2_protection_years:
    scope: structural
    estimated: false
    value: 2.0
    sources: []

  # --- Protection (leaky; VE against typical disease = 1 - sigma * pi) ----
  sigma_maternal:
    scope: structural
    estimated: false
    value: 0.3
    note: With pi_maternal 0.3 gives VE 0.91 against infant typical disease.
    sources: [amirthalingam_2014]
  pi_maternal:
    scope: structural
    estimated: false
    value: 0.3
    sources: [amirthalingam_2014]
  sigma_d1:
    scope: structural
    estimated: false
    value: 1.0
    sources: []
  pi_d1:
    scope: structural
    estimated: false
    value: 0.5
    sources: [quinn_2014]
  sigma_d2:
    scope: structural
    estimated: false
    value: 1.0
    sources: []
  pi_d2:
    scope: structural
    estimated: false
    value: 0.2
    sources: [quinn_2014]
  sigma_wP:
    scope: structural
    estimated: false
    value: 0.17
    sources: [gambhir_2015]
  sigma_aP:
    scope: structural
    estimated: true
    distribution: beta
    a: 3.0
    b: 7.0
    bounds: [0.01, 0.99]
    note: aP protects against disease more than against infection.
    sources: [warfel_2014]
  sigma_tdap:
    scope: structural
    estimated: false
    value: tie_to_sigma_aP
    sources: [warfel_2014]
  pi_protected:
    scope: structural
    estimated: false
    value: 0.15
    sources: []
  pi_wP_waned:
    scope: structural
    estimated: false
    value: 0.3
    sources: [choi_2016]
  pi_aP_waned:
    scope: structural
    estimated: true
    distribution: beta
    a: 2.0
    b: 3.0
    bounds: [0.01, 0.99]
    note: >-
      Typical-course probability for waned aP-primed people; the cohort route
      by which aP priming changes the age of reported disease.
    sources: [domenech_de_celles_2018]

  # --- Demography --------------------------------------------------------
  nudge_years:
    scope: structural
    estimated: false
    value: 0.25
    sources: []

  # --- Observation model (implemented in M3) ------------------------------
  reporting_logit:
    scope: observation
    estimated: true
    distribution: random_walk_logit
    bands: ["<1", "1-4", "5-9", "10-19", "20-59", "60+"]
    first_band_mean_logit: -1.4     # about 20% of typical infant cases
    first_band_sd: 1.5
    step_sd: 0.7
    sources: [brett_2026, choi_2016]
  breakthrough_reporting_ratio:
    scope: observation
    estimated: true
    distribution: lognormal
    median: 0.05
    log_sd: 0.8
    bounds: [0.001, 1.0]
    sources: [brett_2026]
  detection_multiplier:
    scope: observation
    estimated: true
    distribution: lognormal_from_timeline
    note: >-
      One multiplier per non-reference period in
      data/raw/pertussis_diagnostic_standards_timeline.csv; log-mean is the log
      ratio of the period prior mean to the reference-period mean, log-sd is
      (log upper - log lower) / 3.92.
    sources: [brett_2026, qiao_zhao_2025]
  nb_size:
    scope: observation
    estimated: true
    distribution: lognormal
    median: 10.0
    log_sd: 1.0
    bounds: [0.5, 1000.0]
    sources: [brett_2026]
  dirichlet_concentration:
    scope: observation
    estimated: true
    distribution: lognormal
    median: 200.0
    log_sd: 1.0
    bounds: [5.0, 100000.0]
    note: Effective sample size of one country-year age composition.
    sources: []

references:
  anderson_may_1991:
    citation: "Anderson RM, May RM. Infectious Diseases of Humans. Oxford University Press; 1991."
    verification: citation
  kretzschmar_2010:
