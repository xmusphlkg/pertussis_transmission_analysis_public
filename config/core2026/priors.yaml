  choi_2016:
    citation: "Choi YH, Campbell H, Amirthalingam G, van Hoek AJ, Miller E. Investigating the pertussis resurgence in England and Wales, and options for future control. BMC Med 2016;14:121. doi:10.1186/s12916-016-0665-8"
    verification: fulltext
  choi_2026:
