      duration_days: 21
      source: &id001
        citation: Salomon JA et al. Disability weights for the Global Burden of Disease
          2013 study. Lancet Glob Health 2015;3:e712-e723.
        doi: 10.1016/S2214-109X(15)00069-8
        url: https://www.ecdc.europa.eu/sites/default/files/media/en/healthtopics/burden_of_communicable_diseases/Documents/External%20articles/Salomon%20et%20al%20Lancet%20Global%20Health%202015_DWs.pdf
        locator: Table 2, page e717 (PDF page 6), infectious disease acute episode
        verification: primary_table_verified_20261101
      notes: The generic disability weight is verified; mapping to pertussis and 21-day
        duration are model assumptions. Weight and duration held fixed within each
        PSA; sensitivity uses 0.133.
    pertussis_acute_severe:
      value: 0.279
      uncertainty_95ci:
