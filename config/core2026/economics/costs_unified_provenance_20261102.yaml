        0.279 is the GBD 2019 value for severe acute lower respiratory infection,
        used as a proxy for critically ill infant pertussis.

        '
      source:
        citation: 'GBD 2019 Disease and Injury Incidence and Prevalence Collaborators.
          Global burden of 369 diseases and injuries. Lancet 2020;396:1204-1222. DW
          for severe acute lower respiratory infection: 0.279 (0.189-0.383).

          '
        url: https://www.healthdata.org/research-analysis/gbd
        locator: GBD 2019 disability weights supplementary
