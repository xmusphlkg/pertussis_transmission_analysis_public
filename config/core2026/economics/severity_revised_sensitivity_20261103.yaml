revision_20261103:
  purpose: Correct source subgroup and age boundary; historical survivor-cohort sensitivity, not validated
    current national severity.
  original_source: config/core2026/economics/severity_priors_provenance_20261102.yaml
  noninfant_mortality_main: Unestimated in six countries; calibrated infant mortality unchanged.
  optional_noninfant_overlay:
    name: Brazil_recorded_outcome_CFR_transfer
    countries:
    - Australia
    - England
    - Sweden
    - Japan
    - New_Zealand
    - China
    age_start_years: 1.0
    implementation: scripts.revise_clinical_inputs_20261103.sample_noninfant_risk_endpoints
    status: structural_cross_country_transfer_sensitivity_not_national_estimate
    multiplier_scenarios:
    - 0.5
    - 1.0
    - 2.0
    multiplier_interpretation: Analyst-selected stress tests, not confidence limits or probabilities.
    limitation: Brazil denominator is confirmed cases with recorded outcomes; transport to other surveillance
      endpoints is an explicit unvalidated assumption.
