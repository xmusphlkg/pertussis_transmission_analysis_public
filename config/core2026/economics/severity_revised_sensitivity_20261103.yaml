  China:
    status: literature
    gaps:
    - quantity: hospitalisation_proportion
      age_groups: all
      status: no_source
      reason: 'Population-based hospitalization rate study (PMID 39652276: "Population-based active surveillance
        of pertussis hospitalization rates in two cities of China") returned CAPTCHA/403 at time of retrieval
        and is listed as unreachable. Chengdu hospital cohort (Peng et al. 2025 Front Pediatr; 643 hospitalised
        children) gives case mix within admitted patients only, not a population-level hospitalization
        proportion.'
      borrowing_rule: use Brazil national per-confirmed-case hospitalisation data for all ages
    - quantity: cfr
      age_groups: all
      status: no_source
      reason: 'National age-specific CFR inaccessible. National total 2024: 31 pertussis deaths (cited
        in Peng et al. 2025 Introduction), but total annual 2024 cases and age breakdown unavailable from
        accessible literature. CCDCW PDF returned 403/404.'
      borrowing_rule: use Australia calibrated reference risk
    entries:
    - quantity: los_days
      basis: per_hospitalised_case
      age_start_years: 0.0
      age_end_years: 0.5
      distribution: lognormal
      params:
        meanlog: 2.197
        sdlog: 0.18
      point: 9.0
      source:
        citation: 'Peng X et al. Epidemiological and clinical characteristics of children with pertussis:
          a 6-year retrospective cohort study in Chengdu, China. Front Pediatr. 2025. PMID 40933697.'
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12417492/
        locator: Table 3; <6 months group; median LOS 9 days (IQR 7-10)
        period: 2018-2023
        verification: fulltext
      notes: Hospital cohort only (n=351 under 6m of 643 total); sdlog approximated from IQR 7-10 via
        log-normal quantile method. Not applicable to community cases.
    - quantity: los_days
      basis: per_hospitalised_case
      age_start_years: 0.5
      age_end_years: 18.0
      distribution: lognormal
      params:
        meanlog: 2.079
        sdlog: 0.2
      point: 8.0
      source:
        citation: Peng X et al. Front Pediatr. 2025. PMID 40933697.
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12417492/
        locator: Table 3; >=6 months group; median LOS 8 days (IQR 6.5-10); overall mean 8.6 (SD 2.8)
        period: 2018-2023
        verification: fulltext
      notes: Paediatric hospital cohort; applies to <18y; no adult LOS data
  Japan:
    status: literature
    gaps:
    - quantity: hospitalisation_proportion
      age_groups: all
      status: no_source
      reason: JIHS IASR vol 47 no. 551 (2026) PDF (id-info.jihs.go.jp/en/surveillance/iasr/ pathogens/vol47/551/551e.pdf)
        is image-only; text extraction failed. IASR 496e.pdf similarly image-only. No alternate accessible
        text source found for Japan age-specific hospitalization rates.
      borrowing_rule: use Brazil national per-confirmed-case hospitalisation data for all ages
    - quantity: cfr
      age_groups: all
      status: no_source
      reason: Same document access issue as hospitalization_proportion.
      borrowing_rule: use England calibrated reference risk
    entries: []
  New_Zealand:
    status: literature
    gaps:
    - quantity: hospitalisation_proportion
      age_groups: <2m, 2-11m (preferred split)
      status: no_source_for_split
      reason: PHF Science reports use <1y aggregate boundary; cannot split into <2m and 2-11m without
        assumption. Entry below is for <1y only.
    - quantity: hospitalisation_proportion
      age_groups: 1-4y, 5-9y, 10-19y, 20-59y, 60+y
      status: no_source
      reason: PHF Science epidemic reports do not provide these age groups.
      borrowing_rule: use Brazil national per-confirmed-case hospitalisation data where national data
        are absent
    - quantity: cfr
      age_groups: all
      status: no_source
      reason: No deaths reported in PHF Science surveillance reports covering Oct 19-Dec 11, 2024 epidemic
        period. Historical New Zealand ESR annual reports were inaccessible (PDFs image-only, text extraction
        failed).
      borrowing_rule: use England calibrated reference risk
    entries:
    - quantity: hospitalisation_proportion
      basis: per_confirmed_case
      age_start_years: 0.0
      age_end_years: 1.0
      distribution: beta
      params:
        alpha: 13.5
        beta: 12.5
      point: 0.52
      source:
        citation: PHF Science New Zealand Pertussis Report, cumulative epidemic data to 11 December 2024.
        url: https://www.phfscience.nz/media/ecwbsaof/2024-12-12-pertussis-report.pdf
        locator: 'p.1: ''25 cases (5.1%) aged less than 1 year, of which 13 (52.0%) were hospitalised'''
        period: 2024-10-19 to 2024-12-11
        verification: abstract_only
      notes: Age group is <1y (source boundary), spanning both preferred model groups (<2m and 2-11m).
        Small sample (n=25); epidemic still in progress at time of report. Concurrent reports show range
        43-75% hospitalisation for <1y across different 4-weekly periods.
  Sweden:
    status: literature
    gaps:
    - quantity: cfr
      age_groups: all
      status: no_source
      reason: No accessible Swedish national CFR data by age group found.
      borrowing_rule: use England calibrated reference risk
    - quantity: hospitalisation_proportion
      age_groups: 6 months and older
      status: no_age_matched_national_source_in_this_revision
      reason: Aronsson study covers only surviving infants younger than 6 months.
      borrowing_rule: Retain explicitly labelled Brazil national age-specific hospital donor.
    entries:
    - quantity: hospitalisation_proportion
      basis: per_confirmed_case
      age_start_years: 0.0
      age_end_years: 0.5
      distribution: beta
      params:
        alpha: 218.5
        beta: 127.5
      point: 0.6318840579710145
      source:
        citation: Aronsson B et al. Acta Paediatrica. DOI 10.1111/apa.70300; online 2025-09-15; print
          2026;115:2566-2571.
        url: https://onlinelibrary.wiley.com/doi/10.1111/apa.70300
        locator: Methods 2.1; Results 3.1 and 3.2; Table 1
        period: 2009-2015
        verification: fulltext
        accessed: '2026-11-03'
      notes: Historical sensitivity among 345 included surviving laboratory-confirmed infants aged <6
        months; 218 hospitalised for at least one night. Deaths excluded; two further cases excluded for
        missing source-of-infection information. Beta(218.5,127.5) uses Jeffreys half-count prior and
        represents sampling uncertainty within this cohort, not temporal/selection transportability. Constant
        within <6 months is an assumption. Ages 6-11 months use explicit Brazil hospital donor; no extrapolation
        of this Swedish fraction above 6 months.
  Thailand:
    status: national_data
    notes: 'CFR from Thailand DDC Annual Epidemiological Surveillance Report 2024 (Annual_2567.pdf), Table
      11 (cases by age group, p.300) and Table 12 (deaths by age group, p.303). Age boundaries follow
      source; the first source group (<28 days) differs from preferred <2 months; the second (1-11 months)
      starts at 28 days. Cannot align to preferred <2m / 2-11m split without assumption — source boundaries
      used as-is. Hospitalisation proportion: no population-level national data accessible. Best available:
      Siriraj Children Hospital Bangkok surveillance (Vijarnsorn et al. 2019 IJID PMID 30684746): ~79-80%
      hospital admission in confirmed paediatric cases — hospital-based setting, not population-level;
      not included as a quantitative entry.'
    gaps:
    - quantity: hospitalisation_proportion
      age_groups: all
      status: no_source
      reason: National DDC tables do not report hospitalisation proportions by age group in the accessible
        text or image tables. Place-of-treatment table (Table 15) could not be reliably parsed without
        column headers.
      borrowing_rule: use Brazil national per-confirmed-case hospitalisation data for all ages
    entries:
    - quantity: cfr
      basis: per_confirmed_case
      age_start_years: 0.0
      age_end_years: 0.0767
      distribution: beta
      params:
        alpha: 0.5
        beta: 5.5
      point: 0.0
      source:
        citation: Thailand DDC Annual Epidemiological Surveillance Report 2024 (Annual_2567). Bureau of
          Epidemiology, DDC, Ministry of Public Health.
        url: data/raw/country_health_age_20261027/Thailand/Annual_2567.pdf
        locator: Table 11 p.300 (cases) and Table 12 p.303 (deaths); pertussis row; column <28 Day
        period: '2024'
        verification: fulltext
      notes: 5 cases, 0 deaths. Source boundary <28 days (0.0767y) ≠ preferred <2 months (0.1667y). Denominator
        = all notified cases (not recorded-outcome subset). Laplace prior.
    - quantity: cfr
