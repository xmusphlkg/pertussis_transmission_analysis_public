schema: core2026-programme-v1
country: Brazil
iso3: BRA
status: migration_test_country_specific_assumptions
sensitivity_priority: high
sources:
  wuenic_2025:
    citation: WHO/UNICEF Estimates of National Immunization Coverage, DTP1/DTP3, 2025
      revision; repository export used by core2026.
    url: https://immunizationdata.who.int/
    ledger: coverage_series_external_validation
  coverage_pre1990_assumption:
    citation: Modeling assumption for pre-1990 coverage where the M2 ledger has policy
      context but no annual national uptake series; replace when historical survey/registry
      data are assembled.
    url: data/processed/m2_vaccination_history/README.md
    ledger: coverage_pre_1990_open_item
  coverage_projection_2050:
    citation: Core2026 projection assumption after the last observed WUENIC year;
      held near the recent national level for forward simulation.
    url: config/core2026/programmes/README.md
    ledger: projection_assumption
  ledger_schedule:
    citation: 'M2 Brazil ledger: PNI whole-cell schedule, boosters and combination-product
      changes.'
    url: data/processed/m2_vaccination_history/australia_brazil.md
    ledger: Brazil event ledger
  ledger_maternal:
    citation: 'M2 Brazil ledger: national maternal dTpa introduction in November 2014
      and timing changes.'
    url: data/processed/m2_vaccination_history/australia_brazil.md
    ledger: Brazil maternal programme
  timeliness_assumption:
    citation: Shared whole-month timeliness prior used for the core2026 input bundle;
      country-specific dose-date distributions are not yet available.
    url: config/core2026/programmes/README.md
    ledger: timeliness_open_item
  national_policy:
    url: https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/d/dtpa/dtpa
    citation: 'Ministry of Health: maternal dTpa introduced in 2014, from 20 weeks
      gestation'
    ledger: country_health_migration_20261027
  migration_assumption:
    url: analysis/country_health_migration_20261027.md
    citation: Exploratory scenario assumption; uptake levels are not observed national
      estimates; nominal monthly spacing for Japan doses 2–3
    ledger: country_health_migration_20261027
  age_case_source_verification:
    url: analysis/country_age_source_verification_20261027.md
    citation: Independent checks of official national age and month cells with original-file
      SHA256; 2026-10-27
    ledger: analysis/country_age_verification/decisions.csv
