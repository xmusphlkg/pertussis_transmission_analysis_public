sensitivity_variants:
  brazil_maternal_start:
    description: November 2013 wording in secondary literature versus November 2014
      dated Ministry notice.
    maternal_start: '2013-11-01'
    operations:
    - kind: set_dose_field
      block: maternal
      name: __period_start__
      field: start
      value: '2013-11-01'
  brazil_booster_2004_age:
    description: Historical source reports 4-6 years; core uses 4 years after standardisation.
    preschool_age_years: 5.0
    operations:
    - kind: set_dose_field
      block: cohort_doses
      name: preschool
      field: age_years
      value: 5.0
notes: Childhood pertussis remains wP in the national PNI; no national adolescent
  Tdap is encoded.
