sensitivity_variants:
  japan_1975_1981:
    description: Complete-gap alternative to the late-primary baseline; cohorts reaching
      age 2 in 1977-1981 receive no pertussis vaccine.
    coverage_gap: 1975-1981
    operations:
    - kind: set_coverage_segment
      series: late_primary
      from: 1977
      to: 1981
      value: 0.0
  japan_primary_start_age:
    description: Late primary series at mean age 3.5 instead of 2.5 years (ledger
      reports first doses at 24-48 months in 1981-1988).
    operations:
    - kind: set_dose_field
      block: cohort_doses
      name: late_primary_2y
      field: age_years
      value: 3.5
  japan_late_primary_high_coverage:
    description: High-coverage alternative for the 1982-1989 late primary series,
      motivated by the 40.3 million recorded doses divided by an approximate four-dose
      series.
    operations:
    - kind: set_coverage_segment
      series: late_primary
      from: 1982
      to: 1989
      value: 0.9
notes: From 1975 to 1989 the primary series is a late cohort series at mean age 2.5
  years (late_primary_2y); infant doses resume in 1990. 11-12-year DT is not a pertussis
  dose.
