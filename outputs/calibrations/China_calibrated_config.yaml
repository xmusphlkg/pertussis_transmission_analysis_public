        practice and every intervention strategy. The 2.5% and 97.5% percentile endpoints
        are paired parametric-bootstrap 95% confidence intervals for the fitted scenario-reduction
        estimand. They are neither posterior credible intervals nor future-observation
        prediction intervals. Biological quantities, intervention definitions, AR(1)
        hyperparameters, and NB2 dispersion remain fixed at prespecified reference
        values.

        '
    figure1b_current_practice_conditional_parametric_bootstrap_confidence_interval:
      replicates_per_country: 1024
      minimum_successful_replicates: 1000
      minimum_success_fraction: 0.95
      maximum_tail_probability_mcse: 0.005
      stability_blocks: 8
      parallel_workers: 48
      checkpoint_chunk_size: 50
      retry_maxiter_schedule:
      - 64
      - 128
      seed: 20260718
      note: 'Figure 1b current-practice-only conditional uncertainty route. Each replicate
        holds the accepted fitted annual latent transmission path as the generating
        trajectory, regenerates grouped NB2 surveillance counts, fully refits the
        country state-space MAP model, and runs current practice once. The reported-case,
        symptomatic-case, and infection indices are retained from the same fitted
        replicate. Percentile endpoints are conditional parametric-bootstrap confidence
        intervals, not posterior credible intervals or future-observation prediction
        intervals. Biological quantities, AR(1) hyperparameters, and NB2 dispersion
        remain fixed at prespecified reference values.

        '
    figure2c_joint_credible_interval:
      posterior_draws_per_country: 4096
      note: 'Retired checkpoint-compatible route, retained only for provenance. Figure
        2c previously used paired draws from the multi-country full-feedback joint
        posterior. Shared biological parameters, country beta/reporting, and annual
        latent transmission states are jointly weighted by the exact NB2 plus AR(1)
        plus mechanistic ODE target. Intervention implementation and effect quantities
        have prespecified priors and no direct likelihood, so their posterior equals
        their prior; the same complete draw is propagated through current practice
        and each intervention. The plotted 2.5% and 97.5% quantiles are joint-posterior
        95% credible intervals.

        '
      intervention_priors:
        adolescent_coverage_floor:
          low: 0.75
          mode: 0.9
          high: 0.98
          distribution: triangular
          note: Plausible achieved adolescent Tdap coverage floor under scale-up.
        maternal_coverage_floor:
          low: 0.55
          mode: 0.75
          high: 0.9
          distribution: triangular
          note: Plausible achieved pregnancy Tdap coverage floor under scale-up.
        young_adult_coverage_floor:
          low: 0.35
          mode: 0.55
          high: 0.75
          distribution: triangular
          note: Plausible achieved close-contact/reproductive-age adult Tdap coverage
            floor.
        contact_reduction_fraction:
          low: 0.05
          mode: 0.15
          high: 0.3
          distribution: triangular
          note: Directional reduction in young-adult to infant effective contacts
            for adjunct exposure reduction.
        targeted_pep_coverage:
          low: 0.05
          mode: 0.45
          high: 0.6
          distribution: triangular
          note: Plausible household-contact PEP reach among guideline-prioritized
            contacts.
        maternal_protection_duration_days:
          low: 90.0
          mode: 180.0
          high: 270.0
          distribution: triangular
          note: Duration of passive maternal protection in early infancy.
    note: 'The canonical route is multi-country adaptive tempered SMC over the full
      joint state: seven shared biological parameters plus country-specific beta,
      reporting, and annual AR(1) transmission paths. Tempering proceeds from the
      normalized joint prior to the exact NB2/ODE target, with island-wise resampling
      and exact-target shared/state rejuvenation moves. The former conditional cut
      and nested importance routes are retained only as rejected sensitivity implementations
      and are not publication inputs.

      '
    convergence_criteria:
      rhat_threshold: 1.05
      min_bulk_ess: 100
      min_tail_ess: 50
      recommended_rhat_threshold: 1.01
      recommended_min_bulk_ess: 400
      recommended_min_tail_ess: 400
      note: 'SMC islands are independent diagnostic chains. Publication acceptance
        requires final temperature 1, stage-wise island ESS control, active rejuvenation,
        adequate particle and island diversity, rank-normalized cross-island R-hat/bulk/tail
        ESS, complete annual process paths, cross-country shared-draw pairing, and
        rolling-origin predictive checks.

        '
    adaptive_metropolis:
      adaptation_start: 50
      mixing_fraction: 0.95
      epsilon: 1.0e-06
      note: 'Adaptive Metropolis (Haario et al. 2001) learns the empirical covariance
        from chain history during warmup. After adaptation_start steps, the proposal
        is 95% adapted covariance + 5% initial diagonal for ergodicity. The adapted
        covariance captures correlations such as the strong negative correlation between
        beta_S and reporting_multiplier.

        '
    priors:
      log_beta_S_sd: 1.25
      log_reporting_multiplier_sd: 0.35
      VE_sus:
