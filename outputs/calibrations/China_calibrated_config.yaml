  baseline_vaccine_scenario: symptom_protective
  baseline_resistance_scenario: country_timeline
  baseline_country_profile: China
  fitness_grid:
    random_seed: 20260510
    fitness_R_values:
    - 0.7
    - 0.8
    - 0.85
    - 0.9
    - 0.95
    - 0.98
    - 1.0
    - 1.02
    - 1.05
    - 1.1
    - 1.15
    - 1.2
    - 1.25
    VE_inf_values:
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    description: 'Continuous macrolide-resistant strain fitness stress test crossed
      with plausible-to-upper-bound vaccine infectiousness effects. VE_inf is the
      reduction in onward infectiousness among infected vaccine-history origins, not
      protection against infection. The fitness grid now includes finer resolution
      around fitness_R = 1.0 (neutral) because epidemiological evidence from China
      (36% to >99% MRBP in 8 years), Japan (83-88% in 2024-2025), and international
      MT28 spread suggests the true fitness is near or above 1.0. Values below 0.85
      are retained for completeness but are increasingly inconsistent with observed
      resistance dynamics. VE_inf axis expanded from 5 to 11 uniform steps (0.05 increments)
      to improve heatmap resolution in Figure 3E/F panels.

      '
  bayesian_uncertainty:
    random_seed: 20260510
    n_chains: 4
    warmup: 2000
    draws: 2000
    thin: 3
    proposal_scale: 1.0
    posterior_predictive_draws_per_country: 100
    dispersion: 50.0
    enable_time_varying_reporting: false
    likelihood_observation_frequency: monthly
    require_calibrated_start: true
    note: 'The production uncertainty path is conditional unless an explicit multi-parameter
      MCMC sampler is requested. The default beta_grid workflow integrates over beta_S
      after fixing reporting, VE, asymptomatic infectiousness, duration, and resistance-fitness
      nuisance parameters; outputs must therefore be interpreted as conditional beta
      uncertainty, not a full structural posterior. Adaptive Metropolis remains available
      for pilot and sensitivity analyses when those additional dimensions are meant
      to be sampled.

      '
    convergence_criteria:
      rhat_threshold: 1.05
      min_bulk_ess: 100
      min_tail_ess: 50
      note: 'Convergence is assessed per-parameter per-country. Parameters with rank-normalized
        split-R-hat > 1.05 or bulk ESS < 100 are flagged. Reference: Vehtari et al.
        (2021) Bayesian Analysis 16(2):667-718.

        '
    adaptive_metropolis:
      adaptation_start: 50
      mixing_fraction: 0.95
      epsilon: 1.0e-06
      note: 'Adaptive Metropolis (Haario et al. 2001) learns the empirical covariance
        from chain history during warmup. After adaptation_start steps, the proposal
        is 95% adapted covariance + 5% initial diagonal for ergodicity. The adapted
        covariance captures correlations such as the strong negative correlation between
        beta_S and reporting_multiplier.

        '
    priors:
      log_beta_S_sd: 0.8
      log_reporting_multiplier_sd: 0.8
      VE_sus:
        mean: 0.45
        sd: 0.05
        note: 'Literature-informed decomposition parameter for reduced susceptibility
          after aP vaccination. Aggregate studies support high disease protection
          and waning protection, but do not directly identify this component from
          surveillance data; the posterior is constrained to [0.30, 0.60] as a modeling
          range.

          '
      VE_inf:
        mean: 0.25
        sd: 0.05
        note: 'Literature-informed decomposition parameter for reduced onward infectiousness
          among vaccinated infections. It is motivated by aP transmission-blocking
          evidence and waning studies, but the exact component is not directly measured
          in country surveillance; range [0.12, 0.38] spans weak-to-moderate residual
          transmission blocking.

          '
      VE_dur:
        mean: 0.1
        sd: 0.1
        note: 'Mechanistic duration-shortening proxy fixed at the prior mean during
          the conditional beta-grid analysis; treated as a vaccine-scenario assumption
          rather than a directly estimated literature parameter.

          '
      relative_infectiousness_asymptomatic:
        mean: 0.45
        sd: 0.1
        note: 'Relative infectiousness of asymptomatic/subclinical infections compared
          to symptomatic cases. The exact ratio is weakly identified and not directly
          available from routine surveillance; range [0.20, 0.70] spans minimal subclinical
          transmission to near-equal infectiousness.

          '
      infectious_duration_symptomatic:
        log_sd: 0.15
        note: 'Clinical natural-history nuisance parameter centered on the CDC-aligned
          21-day symptomatic infectious window; uncertainty range captures plausible
          variation around the clinical anchor.

          '
      infectious_duration_asymptomatic:
        log_sd: 0.2
        note: 'Modeling assumption centered on a shorter mild/asymptomatic infectious
          window than symptomatic pertussis; uncertainty range retained because this
          duration is not directly measured.

          '
      fitness_R:
        min: 0.7
        max: 1.25
        mean: 1.0
        sd: 0.12
        note: 'Epidemiologically motivated prior centered on fitness-neutral (1.0),
          because MRBP reached near-fixation in China within 8 years and spread internationally
          without clear transmission disadvantage. This is not a direct measured relative-fitness
          estimate; SD of 0.12 allows modest fitness costs or advantages.

          '
      resistance_prevalence:
        floor_sd: 0.03
        note: 'Resistance prevalence is FIXED at the country-calibrated value during
          MCMC (not sampled). The country_resistance_timeline.csv provides well-constrained
          estimates for most countries. This eliminates a major source of multimodality
          without losing scientific information.

          '
      maternal_VE_sus:
        mean: 0.55
        sd: 0.12
        note: 'Prior for maternal antibody protection against infant infection. Centered
          on 0.55 using maternal Tdap effectiveness evidence for confirmed pertussis
          in infants younger than 2 months [36], which combines infection prevention
          and disease prevention. The infection-blocking component is a decomposed
          model assumption guided by maternal immunization effectiveness studies [10,12].
          SD of 0.12 allows exploration of [0.30, 0.80].

          '
      maternal_VE_sym:
        mean: 0.92
        sd: 0.05
        note: 'Prior for maternal antibody protection against symptomatic disease
          given infection. High confidence based on consistent estimates of VE against
          hospitalization (>90%) across US, UK, and Argentina studies [10,36,37].
          Narrow SD reflects strong evidence consensus.

          '
    stochastic_overlay:
      enabled: true
      random_seed: 20260511
      replicates_per_draw: 200
      superspreading_k: 10.0
      superspreading_k_min: 1.0
      household_mean_size: 3.5
      household_secondary_attack_rate: 0.8
      min_expected_count: 1.0
      credible_interval:
        low: 2.5
        high: 97.5
      k_sensitivity_values:
      - 5.0
      - 10.0
      - 20.0
      - 30.0
      - 50.0
      note: 'Negative-binomial observation overlay injecting two stochastic sources
        onto each deterministic posterior-predictive draw. Superspreading enters as
        an aggregate-scale NB2 dispersion k = 10 (empirical surveillance range 5-50;
        the calibration likelihood already uses dispersion = 50); this captures the
        tail of transmission heterogeneity (Lloyd-Smith et al. Nature 2005; Endo et
        al. 2020) that remains after aggregating individual-level offspring variability
        to country-year counts. Household clustering enters as the Ball, Mollison
        & Scalia-Tomba (1997) design effect DEFF = 1 + (m_bar - 1) * SAR with m_bar
        = 3.5 and pertussis household SAR = 0.8. Effective dispersion combines both
        via 1/k_eff = 1/k_ss + (DEFF - 1)/mu so household clustering dominates at
        small mu while superspreading dominates at large mu. Combined 95% PI is pooled
        over parameter draws and stochastic replicates; parameter- only and stochastic
        components are reported separately. The k_sensitivity_values sweep demonstrates
        how the combined PI width varies across the plausible range of aggregate dispersion
        (k=5 to k=50), making the assumption explicit and auditable. Addresses Lavine
        et al. (2011) sensitivity concern by making both parameter uncertainty and
        structural heterogeneity explicit and decomposable.

        '
