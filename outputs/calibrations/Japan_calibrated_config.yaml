    maternal_protection_duration: 90.0
    recovered_immunity_duration: 3285.0
    vaccine_protection_duration: 1825.0
    R_to_W_duration: 1825.0
    W_to_S_duration: 3650.0
  immunity_model:
    mode: maternal_dose_history
    boosting_enabled: true
    boosting_efficiency: 0.7
    waned_natural_infection_susceptibility: 0.35
    boosting_note: 'Immune boosting (Wearing & Rohani 2009; Lavine et al. 2011): individuals
      in the W (waned) state who are re-exposed to circulating pertussis have their
      immunity restored to R without developing symptomatic infection. boosting_efficiency
      (0-1) controls what fraction of force-of-infection exposure events successfully
      boost a W individual back to R. At 0.70, approximately 70% of exposures result
      in successful boosting. This mechanism naturally produces immunity debt during
      periods of reduced circulation (COVID-19 NPIs) and subsequent post-pandemic
      surges.

      '
    waned_relative_effect: 0.35
    maternal_relative_effect: 0.75
    dose1_relative_effect: 0.45
    dose2_relative_effect: 0.75
    waned_vaccine_duration: 3650.0
    initial_recent_fraction: 0.35
    initial_recent_fraction_by_age:
      infant_0_2m: 1.0
      infant_3_11m: 0.85
      child_1_4y: 0.6
      child_5_9y: 0.45
      adolescent_10_17y: 0.25
      young_adult_18_39y: 0.12
      middle_adult_40_64y: 0.08
      elderly_65plus: 0.06
  observation_model:
    enabled: true
    structure: symptomatic_to_care_to_test_to_report
    diagnostic_standards:
      enabled: true
      multiplier_column: relative_detection_prior_mean
      note: 'Applies a literature-coded, country-specific diagnostic/reporting-regime
        multiplier from data/raw/pertussis_diagnostic_standards_timeline.csv to reported-case
        outputs. This is an observation-layer adjustment only; it does not alter infection
        dynamics.

        '
      periods_loaded: 3
    note: 'Runtime reported cases use the age-specific final reporting probabilities
      in age_groups/reporting_rate, with calibration allowed to multiply those probabilities.
      The explicit care/test/report split is retained as the intended observation
      contract for country calibration. IMPORTANT: reporting_rate and reporting_multiplier
      affect ONLY the observation layer (how many true cases appear in surveillance).
      Treatment rates in the ODE are scaled by diagnosis_probability, which defaults
      to the baseline reporting_rate but is NOT modified by reporting_multiplier or
      reporting-rate sensitivity scenarios. This decoupling ensures that reporting-rate
      sensitivity analyses do not inadvertently alter resistance selection pressure
      through the treatment pathway.

      '
  severity_model:
    residual_maternal_protection_for_unvaccinated_origin: false
    note: 'Maternal protection against hospitalization/death is applied to the explicit
      maternal-origin compartment. Population-average maternal coverage is not applied
      to all unvaccinated-origin infants in the baseline, because that would assign
      protection to infants whose mothers were not vaccinated.

      '
  resistance:
    target_prevalence_at_analysis_start: 0.827
    importation_fraction: 0.827
    rebalance_after_burn_in: true
    prevalence_anchor_rate_per_year: 2.0
    anchor_during_dynamics: false
    initial_resistance_prevalence_deprecated: true
    use_country_resistance_timeline: true
    country_timeline:
      country: Japan
      iso3: JPN
      resistance_anchor_year: 2025
      resistant_fraction: 0.827
      lower: 0.697
      upper: 0.918
      method: exact_year
      evidence_years: '2025'
      evidence_type: measured_multicenter_isolate_fraction
      source: https://www.mdpi.com/2227-9059/14/1/167
      notes: Japanese children at six clinics, March-August 2025; 43/52 sequenced
        B. pertussis isolates carried the A2047G mutation associated with macrolide
        resistance.
  stochastic_resistance:
    enabled: false
    effective_population_size: 2000
    min_strain_fraction: 0.001
    random_seed: 20260515
    note: 'Experimental tau-leaping stochastic layer for resistance strain dynamics.
      It is disabled for the submitted deterministic analyses. The effective_population_size
      controls the magnitude of genetic drift: smaller values produce more stochastic
      fluctuation and slower fixation. A value of 2000 represents the effective number
      of independent transmission events determining strain composition per output
      time step, accounting for household clustering (SAR~0.8) that reduces the effective
      number of independent events well below the total infectious population. This
      addresses the known limitation that deterministic ODE models produce unrealistically
      fast resistance fixation (model: 2-3 years vs observed: 6-8 years in China)
      by introducing the genetic drift that naturally slows selection in finite populations.

      '
  calibration:
    enabled: false
    allow_stale_parameter_overlay: false
    default_country_profile: Australia
    method: staged_fast
    objective: negative_binomial_reporting_interval_cases
    dispersion: 50.0
    maxiter: 12
    n_starts: 1
    recent_years: 6
    mean_fit_penalty_weight: 50000.0
    acceptance:
      min_overlap_intervals: 5
      max_interval_smape: 1.3
      min_log1p_correlation: -0.3
      peak_ratio_min: 0.25
      peak_ratio_max: 4.0
    simulation_overrides:
      burn_in_years: 15
      output_time_step: 30
      solver_method: RK45
      rtol: 0.0001
      atol: 1.0e-06
    relative_incidence_tolerance: 0.25
    fit_parameters:
    - transmission.beta_S
    - reporting_multiplier
    - transmission.seasonal_amplitude
    - importation.rate_per_100k_per_year
    - resistance.importation_fraction
