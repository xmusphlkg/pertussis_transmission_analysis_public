    npi_contact_reduction:
      enabled: true
      reduction_column: baseline_contact_reduction
      note: 'Loads country-specific COVID-19/NPI effective contact-reduction periods
        from data/raw/covid_npi_contact_reduction_timeline.csv. The baseline uses
        the calibration-screened baseline_contact_reduction column; mean/lower/upper
        proxy values are reserved for temporal sensitivity analyses because nonzero
        shocks can distort country-specific post-pandemic peak timing. Contact shocks
        must not be encoded in diagnostic/reporting multipliers.

        '
      periods_loaded: 1
    npi_contact_reduction_periods:
    - start_date: '2020-04-07'
      end_date: '2021-09-30'
      reduction: 0.3
      baseline_reduction: 0.3
      reduction_mean: 0.3
      reduction_lower: 0.1
      reduction_upper: 0.5
      ramp_days: 180.0
      evidence_strength: moderate
      notes: Proxy all-setting effective contact reduction for emergency declarations
        school disruption masking and voluntary distancing.
    npi_ramp_days: 180.0
