      posterior_draws_per_country: 512
      note: 'Figure 2c uses paired conditional uncertainty draws. Surveillance is
        used once in the annual latent-log-beta state reconstruction; beta, reporting,
        and historical states are proposed by a bounded multi-scale Gauss-Newton mixture
        and corrected against the exact NB2 plus AR(1) target before resampling. Future
        AR(1) innovations, shared external structural-prior draws, and intervention
        implementation/effect draws are then paired across current practice and interventions.
        These are conditional intervals, not full joint Bayesian credible intervals.

        '
      intervention_priors:
        adolescent_coverage_floor:
          low: 0.75
          mode: 0.9
          high: 0.98
          distribution: triangular
          note: Plausible achieved adolescent Tdap coverage floor under scale-up.
        maternal_coverage_floor:
          low: 0.55
          mode: 0.75
          high: 0.9
          distribution: triangular
          note: Plausible achieved pregnancy Tdap coverage floor under scale-up.
        young_adult_coverage_floor:
          low: 0.35
          mode: 0.55
          high: 0.75
          distribution: triangular
          note: Plausible achieved close-contact/reproductive-age adult Tdap coverage
            floor.
        contact_reduction_fraction:
          low: 0.05
          mode: 0.15
          high: 0.3
          distribution: triangular
          note: Directional reduction in young-adult to infant effective contacts
            for adjunct exposure reduction.
        targeted_pep_coverage:
          low: 0.05
          mode: 0.45
          high: 0.6
          distribution: triangular
          note: Plausible household-contact PEP reach among guideline-prioritized
            contacts.
        maternal_protection_duration_days:
          low: 90.0
          mode: 180.0
          high: 270.0
          distribution: triangular
          note: Duration of passive maternal protection in early infancy.
    note: 'The default route is reference_structure_state_space_exact_importance_cut.
      The canonical CLI sampler is state_space_exact_importance_cut; state_space_laplace_cut
      is accepted only as a legacy input alias and is never written to new outputs.
      Externally informed vaccine, duration, asymptomatic-infectiousness, and resistance-fitness
      uncertainty is shared across countries and propagated, but sparse surveillance
      is not allowed to update those structural priors. Legacy grid, Adaptive Metropolis,
      importance, and SMC engines target a separate deterministic no-process likelihood
      from pre-surveillance priors and must be labelled as alternative sensitivity
      analyses.

      '
    convergence_criteria:
      rhat_threshold: 1.05
      min_bulk_ess: 100
      min_tail_ess: 50
      recommended_rhat_threshold: 1.01
      recommended_min_bulk_ess: 400
      recommended_min_tail_ess: 400
      note: 'R-hat/ESS thresholds apply only to genuine MCMC/SMC alternatives. The
        default state-space route instead gates Hessian rank/conditioning, bounded-mixture
        rejection mass, exact-target importance ESS, maximum weight, Pareto-tail shape
        and coordinate-tail support, state-draw count, structural design size, complete
        annual process paths, cross-country structural pairing, and rolling-origin
        predictive checks. Synthetic chain labels are output batching, not Markov
        chains.

        '
    adaptive_metropolis:
      adaptation_start: 50
      mixing_fraction: 0.95
      epsilon: 1.0e-06
      note: 'Adaptive Metropolis (Haario et al. 2001) learns the empirical covariance
        from chain history during warmup. After adaptation_start steps, the proposal
        is 95% adapted covariance + 5% initial diagonal for ergodicity. The adapted
        covariance captures correlations such as the strong negative correlation between
        beta_S and reporting_multiplier.

        '
    priors:
      log_beta_S_sd: 1.25
      log_reporting_multiplier_sd: 0.35
      VE_sus:
        mean: 0.15
        sd: 0.1
        note: 'Weak vaccine-mechanism prior for reduced susceptibility, centred on
          the selected symptom-protective baseline. Aggregate studies do not identify
          this acquisition component separately; see parameter_distributions.yaml
          for support and provenance.

          '
      VE_inf:
        mean: 0.25
        sd: 0.15
        note: 'Broad vaccine-mechanism prior for reduced onward infectiousness among
          vaccinated infections. Human data support residual transmission but do not
          identify this component separately.

          '
      VE_dur:
        mean: 0.1
        sd: 0.1
        note: 'Mechanistic duration-shortening proxy for reduced infectious duration
          among vaccinated infections. It is sampled jointly in the shared external-prior
          structural design for Figure 2c and remains a vaccine-mechanism sensitivity
          parameter in deterministic diagnostics.

          '
      relative_infectiousness_asymptomatic:
        mean: 0.5
        sd: 0.25
        note: 'Relative infectiousness of asymptomatic/subclinical infections compared
          to symptomatic cases. The exact ratio is not identified; the central registry
          assigns a broad weak-model prior.

          '
      infectious_duration_symptomatic:
        log_sd: 0.103
        note: 'Compatibility width only. The normalized Bayesian prior is centred
          at the literature model-fit median of 24 days and truncated to [14, 35]
          days in parameter_distributions.yaml.

          '
      infectious_duration_asymptomatic:
        log_sd: 0.3
        note: 'Weak modelling assumption; the central registry uses median 17.3 days
          and support [7, 28] because human data do not identify it.

          '
      fitness_R:
        min: 0.7
        max: 1.25
        mean: 1.0
        sd: 0.15
        note: 'Compatibility width alias. Production uses the central truncated lognormal
          weak-model prior (median 1.0, log-SD 0.15, support [0.70, 1.25]).

          '
      resistance_prevalence:
        floor_sd: 0.03
        note: 'Resistance prevalence is FIXED at the country-calibrated value during
          MCMC (not sampled). The country_resistance_timeline.csv provides well-constrained
          estimates for most countries. This eliminates a major source of multimodality
          without losing scientific information.

          '
      maternal_VE_sus:
        mean: 0.55
        sd: 0.12
        note: 'Prior for maternal antibody protection against infant infection. Centered
          on 0.55 using maternal Tdap effectiveness evidence for confirmed pertussis
          in infants younger than 2 months [36], which combines infection prevention
          and disease prevention. The infection-blocking component is a decomposed
          model assumption guided by maternal immunization effectiveness studies [10,12].
          SD of 0.12 allows exploration of [0.30, 0.80].

          '
      maternal_VE_sym:
        mean: 0.92
        sd: 0.05
        note: 'Prior for maternal antibody protection against symptomatic disease
          given infection. High confidence based on consistent estimates of VE against
          hospitalization (>90%) across US, UK, and Argentina studies [10,36,37].
          Narrow SD reflects strong evidence consensus.

          '
    stochastic_overlay:
      enabled: true
      random_seed: 20260511
      replicates_per_draw: 200
      superspreading_k: 10.0
      superspreading_k_min: 1.0
      household_mean_size: 3.5
      household_secondary_attack_rate: 0.8
      min_expected_count: 1.0
      credible_interval:
        low: 2.5
        high: 97.5
      k_sensitivity_values:
      - 5.0
      - 10.0
      - 20.0
      - 30.0
      - 50.0
      note: 'Negative-binomial observation overlay injecting two stochastic sources
        onto each deterministic posterior-predictive draw. Superspreading enters as
        an aggregate-scale NB2 dispersion k = 10 (empirical surveillance range 5-50;
        the calibration likelihood already uses dispersion = 50); this captures the
        tail of transmission heterogeneity (Lloyd-Smith et al. Nature 2005; Endo et
        al. 2020) that remains after aggregating individual-level offspring variability
        to country-year counts. Household clustering enters as the Ball, Mollison
        & Scalia-Tomba (1997) design effect DEFF = 1 + (m_bar - 1) * SAR with m_bar
        = 3.5 and pertussis household SAR = 0.8. Effective dispersion combines both
        via 1/k_eff = 1/k_ss + (DEFF - 1)/mu so household clustering dominates at
        small mu while superspreading dominates at large mu. Combined 95% PI is pooled
        over parameter draws and stochastic replicates; parameter- only and stochastic
        components are reported separately. The k_sensitivity_values sweep demonstrates
        how the combined PI width varies across the plausible range of aggregate dispersion
        (k=5 to k=50), making the assumption explicit and auditable. Addresses Lavine
        et al. (2011) sensitivity concern by making both parameter uncertainty and
        structural heterogeneity explicit and decomposable.

        '
