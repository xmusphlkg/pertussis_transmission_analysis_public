      infant_3_11m: 0.005
      child_1_4y: 0.0003
      child_5_9y: 0.0001
      adolescent_10_17y: 5.0e-05
      young_adult_18_39y: 5.0e-05
      middle_adult_40_64y: 0.0003
      elderly_65plus: 0.002
    origin_conditional_ve_hospitalization:
      unvaccinated: 0.0
      maternal: 0.5
      dose1_recent: 0.5
      dose1_waned: 0.2
      dose2_recent: 0.65
      dose2_waned: 0.3
      recent: 0.75
      waned: 0.35
    origin_conditional_ve_death:
      unvaccinated: 0.0
      maternal: 0.8
      dose1_recent: 0.6
      dose1_waned: 0.25
      dose2_recent: 0.7
      dose2_waned: 0.35
      recent: 0.8
      waned: 0.4
    note: 'Maternal protection against hospitalization/death is applied to the explicit
      maternal-origin compartment. Population-average maternal coverage is not applied
      to all unvaccinated-origin infants in the baseline, because that would assign
      protection to infants whose mothers were not vaccinated. The maternal 0.50 VE
      against hospitalization given symptomatic disease is a structural cascade mapping,
      not a directly estimated conditional effect: with maternal_relative_effect=0.75,
      maternal_VE_sus=0.55, and maternal_VE_sym=0.92, it gives approximately 91% overall
      effectiveness against hospitalization [1-(1-0.75*0.55)(1-0.75*0.92)(1-0.50)].
      Other origin-specific conditional effects are structural severity assumptions
      rather than direct estimates at every dose/waning state.

      '
  resistance:
    target_prevalence_at_analysis_start: 0.01
    importation_fraction: 0.01
    rebalance_after_burn_in: true
    prevalence_anchor_rate_per_year: 2.0
    anchor_during_dynamics: false
