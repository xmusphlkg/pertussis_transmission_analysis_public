  routine_vaccination:
    enabled: true
    target_relaxation_rate_per_year: 2.0
    max_daily_flow_fraction: 0.01
    note: 'Routine vaccination relaxes toward age-specific target origin distributions,
      but the daily flow from unvaccinated susceptibility is capped at 1% of the available
      unvaccinated susceptible pool to match the ODE implementation and avoid numerical
      overshoot.

      '
  initial_conditions:
    initial_exposed_per_100k: 1.5
    initial_infectious_per_100k: 0.6
    initial_resistance_prevalence: 0.01
    seed_age_distribution:
      infant_0_2m: 0.03
      infant_3_11m: 0.07
      child_1_4y: 0.12
      child_5_9y: 0.13
      adolescent_10_17y: 0.2
      young_adult_18_39y: 0.22
      middle_adult_40_64y: 0.15
      elderly_65plus: 0.08
  treatment:
    treatment_rate_symptomatic: 0.025
    treatment_rate_asymptomatic: 0.002
    sensitive:
      infectious_duration_reduction: 0.2
      infectiousness_reduction: 0.15
    resistant:
      infectious_duration_reduction: 0.1
      infectiousness_reduction: 0.05
  PEP:
    coverage_household_contacts: 0.3
    effectiveness_sensitive: 0.823
    effectiveness_resistant: 0.1
    activation_prevalence: 2.0e-05
  reporting_rate_sensitivity:
    medium:
      multiplier: 1.0
      description: Baseline reporting rates as configured in country profiles.
    high:
      multiplier: 1.5
      description: Uniformly higher reporting (50% increase across all ages).
    low:
      multiplier: 0.5
      description: Uniformly lower reporting (50% decrease across all ages).
    age_biased:
      age_multipliers:
        infant_0_2m: 1.2
        infant_3_11m: 1.1
        child_1_4y: 0.9
        child_5_9y: 0.8
        adolescent_10_17y: 0.7
        young_adult_18_39y: 0.6
        middle_adult_40_64y: 0.5
        elderly_65plus: 0.6
      description: 'Age-biased reporting where infant ascertainment is slightly higher
        and adult/adolescent ascertainment is lower than baseline.

        '
    time_varying:
      multiplier: 1.0
      time_variation:
        start_multiplier: 0.5
        end_multiplier: 1.5
      description: 'Linearly improving reporting over the analysis period (e.g. due
        to increased awareness, better diagnostics, or expanded testing).

        '
    infant_high_adult_very_low:
      age_multipliers:
        infant_0_2m: 1.0
        infant_3_11m: 0.9
        child_1_4y: 0.6
        child_5_9y: 0.5
        adolescent_10_17y: 0.3
        young_adult_18_39y: 0.2
        middle_adult_40_64y: 0.15
        elderly_65plus: 0.2
      description: 'Strong age gradient: infant reporting near baseline but adolescent
        and adult reporting reduced to 3-5% absolute (consistent with Ontario capture-recapture:
        11% of age 1+ cases reported, and England/Wales notification efficiency of
        5-25% overall). This scenario tests whether the true infection burden in adults
        is substantially higher than reported cases suggest.

        '
    infant_moderate_adult_minimal:
      age_multipliers:
        infant_0_2m: 0.7
        infant_3_11m: 0.6
        child_1_4y: 0.5
        child_5_9y: 0.4
        adolescent_10_17y: 0.2
        young_adult_18_39y: 0.1
        middle_adult_40_64y: 0.08
        elderly_65plus: 0.1
      description: 'Extreme under-reporting scenario anchored to the lower end of
        literature estimates. Infant reporting at 35-42% (Ontario hospital study:
        37%), school-age at 2-5%, adults at 0.5-2.5%. Represents passive surveillance
        systems without active case-finding.

        '
    enhanced_surveillance:
      age_multipliers:
        infant_0_2m: 1.3
        infant_3_11m: 1.2
        child_1_4y: 1.4
        child_5_9y: 1.5
        adolescent_10_17y: 1.8
        young_adult_18_39y: 2.5
        middle_adult_40_64y: 2.5
        elderly_65plus: 2.0
      description: 'Enhanced surveillance scenario where improved diagnostics (PCR
        availability, point-of-care testing) increase ascertainment, particularly
        in older age groups. Represents the effect of active surveillance programs
        or outbreak investigations.

        '
    adult_focused_improvement:
      age_multipliers:
        infant_0_2m: 1.0
        infant_3_11m: 1.0
        child_1_4y: 1.0
        child_5_9y: 1.0
        adolescent_10_17y: 2.0
        young_adult_18_39y: 3.0
        middle_adult_40_64y: 3.0
        elderly_65plus: 2.5
      description: 'Scenario where adult/adolescent reporting improves substantially
        (e.g. through Tdap booster awareness campaigns, expanded testing guidelines
        for prolonged cough). Tests sensitivity of total burden estimates to adult
        ascertainment improvements.

        '
    china_passive_system:
      age_multipliers:
        infant_0_2m: 0.8
        infant_3_11m: 0.7
        child_1_4y: 0.5
        child_5_9y: 0.4
        adolescent_10_17y: 0.25
        young_adult_18_39y: 0.15
        middle_adult_40_64y: 0.12
        elderly_65plus: 0.15
      description: 'Calibrated to Yiwu active-surveillance study (China) which found
        community incidence of 108.3/100k vs passive surveillance estimates far below
        this. Represents the gap between active and passive surveillance in a middle-income
        setting.

        '
  baseline_vaccine_scenario: symptom_protective
  baseline_resistance_scenario: country_timeline
  baseline_country_profile: China
  fitness_grid:
    random_seed: 20260510
    fitness_R_values:
    - 0.7
    - 0.8
    - 0.85
    - 0.9
    - 0.95
    - 0.98
    - 1.0
    - 1.02
    - 1.05
    - 1.1
    - 1.15
    - 1.2
    - 1.25
    VE_inf_values:
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    description: 'Continuous macrolide-resistant strain fitness stress test crossed
      with plausible-to-upper-bound vaccine infectiousness effects. VE_inf is the
      reduction in onward infectiousness among infected vaccine-history origins, not
      protection against infection. The fitness grid now includes finer resolution
      around fitness_R = 1.0 (neutral) because epidemiological evidence from China
      (36% to >99% MRBP in 8 years), Japan (83-88% in 2024-2025), and international
      MT28 spread suggests the true fitness is near or above 1.0. Values below 0.85
      are retained for completeness but are increasingly inconsistent with observed
      resistance dynamics. VE_inf axis expanded from 5 to 11 uniform steps (0.05 increments)
      to improve heatmap resolution in Figure 3E/F panels.

      '
  bayesian_uncertainty:
    random_seed: 20260510
    publication_country_exclusions:
      South_Africa: 'Only three recent non-overlapping observation intervals are available,
        below the prespecified five-interval calibration/validation floor. Retain
        as an exploratory deterministic scenario, but exclude it from calibrated policy
        uncertainty until additional surveillance data or a separately justified external
        calibration model is supplied.

        '
    inference_structure: reference_structure_state_space_exact_importance_cut
    shared_structural_seed: 20260712
    n_chains: 4
    warmup: 0
    draws: 128
    thin: 1
    proposal_scale: 1.0
    smc_particles: 1024
    smc_ess_fraction: 0.65
    smc_move_steps: 4
    smc_max_stages: 100
    posterior_predictive_draws_per_country: 100
    dispersion: 50.0
    enable_time_varying_reporting: false
    likelihood_observation_frequency: annual
    require_calibrated_start: true
    state_space_importance:
      adaptation_candidate_count: 512
      adaptation_round_candidate_count: 512
      candidate_count: 1024
      max_adaptive_rounds: 2
      require_recommended_quality: true
      localized_mixture_enabled: true
      localized_candidate_count: 2048
      localized_component_count: 8
      localized_covariance_scale: 0.25
      adaptation_target_ess: 96
      adaptation_covariance_regularization: 0.1
      initial_proposal_covariance_scales:
      - 0.0625
      - 0.25
      - 1.0
      - 4.0
      proposal_covariance_scales:
      - 0.25
      - 0.5
      - 1.0
      - 2.0
      - 4.0
      note: 'The multi-scale Gauss-Newton Gaussian mixture is only a normalized proposal.
        Candidate states are reweighted by the exact NB2 plus AR(1) plus beta/reporting-prior
        target before stratified resampling. Final acceptance requires adequate exact-target
        importance ESS, maximum normalized weight, Pareto-tail shape, coordinate-wise
        2.5%/97.5% tail effective support, and bounded-proposal support. Failure writes
        a full candidate audit but no posterior sample or publication interval.

        '
    figure2c_conditional_uncertainty:
      posterior_draws_per_country: 512
      note: 'Figure 2c uses paired conditional uncertainty draws. Surveillance is
        used once in the annual latent-log-beta state reconstruction; beta, reporting,
        and historical states are proposed by a bounded multi-scale Gauss-Newton mixture
        and corrected against the exact NB2 plus AR(1) target before resampling. Future
        AR(1) innovations, shared external structural-prior draws, and intervention
        implementation/effect draws are then paired across current practice and interventions.
        These are conditional intervals, not full joint Bayesian credible intervals.

        '
      intervention_priors:
        adolescent_coverage_floor:
          low: 0.75
          mode: 0.9
          high: 0.98
          distribution: triangular
          note: Plausible achieved adolescent Tdap coverage floor under scale-up.
        maternal_coverage_floor:
          low: 0.55
          mode: 0.75
          high: 0.9
          distribution: triangular
          note: Plausible achieved pregnancy Tdap coverage floor under scale-up.
        young_adult_coverage_floor:
          low: 0.35
          mode: 0.55
          high: 0.75
          distribution: triangular
          note: Plausible achieved close-contact/reproductive-age adult Tdap coverage
            floor.
        contact_reduction_fraction:
          low: 0.05
          mode: 0.15
          high: 0.3
          distribution: triangular
          note: Directional reduction in young-adult to infant effective contacts
            for adjunct exposure reduction.
        targeted_pep_coverage:
          low: 0.05
          mode: 0.45
          high: 0.6
          distribution: triangular
          note: Plausible household-contact PEP reach among guideline-prioritized
            contacts.
        maternal_protection_duration_days:
          low: 90.0
          mode: 180.0
          high: 270.0
          distribution: triangular
          note: Duration of passive maternal protection in early infancy.
    note: 'The default route is reference_structure_state_space_exact_importance_cut.
      The canonical CLI sampler is state_space_exact_importance_cut; state_space_laplace_cut
      is accepted only as a legacy input alias and is never written to new outputs.
      Externally informed vaccine, duration, asymptomatic-infectiousness, and resistance-fitness
      uncertainty is shared across countries and propagated, but sparse surveillance
      is not allowed to update those structural priors. Legacy grid, Adaptive Metropolis,
      importance, and SMC engines target a separate deterministic no-process likelihood
      from pre-surveillance priors and must be labelled as alternative sensitivity
      analyses.

      '
    convergence_criteria:
      rhat_threshold: 1.05
      min_bulk_ess: 100
      min_tail_ess: 50
      recommended_rhat_threshold: 1.01
      recommended_min_bulk_ess: 400
      recommended_min_tail_ess: 400
      note: 'R-hat/ESS thresholds apply only to genuine MCMC/SMC alternatives. The
        default state-space route instead gates Hessian rank/conditioning, bounded-mixture
        rejection mass, exact-target importance ESS, maximum weight, Pareto-tail shape
        and coordinate-tail support, state-draw count, structural design size, complete
        annual process paths, cross-country structural pairing, and rolling-origin
        predictive checks. Synthetic chain labels are output batching, not Markov
        chains.

        '
    adaptive_metropolis:
      adaptation_start: 50
      mixing_fraction: 0.95
      epsilon: 1.0e-06
      note: 'Adaptive Metropolis (Haario et al. 2001) learns the empirical covariance
        from chain history during warmup. After adaptation_start steps, the proposal
        is 95% adapted covariance + 5% initial diagonal for ergodicity. The adapted
        covariance captures correlations such as the strong negative correlation between
        beta_S and reporting_multiplier.

        '
    priors:
      log_beta_S_sd: 1.25
      log_reporting_multiplier_sd: 0.35
      VE_sus:
        mean: 0.15
        sd: 0.1
        note: 'Weak vaccine-mechanism prior for reduced susceptibility, centred on
          the selected symptom-protective baseline. Aggregate studies do not identify
          this acquisition component separately; see parameter_distributions.yaml
          for support and provenance.

          '
      VE_inf:
        mean: 0.25
        sd: 0.15
        note: 'Broad vaccine-mechanism prior for reduced onward infectiousness among
          vaccinated infections. Human data support residual transmission but do not
          identify this component separately.

          '
      VE_dur:
        mean: 0.1
        sd: 0.1
        note: 'Mechanistic duration-shortening proxy for reduced infectious duration
          among vaccinated infections. It is sampled jointly in the shared external-prior
          structural design for Figure 2c and remains a vaccine-mechanism sensitivity
          parameter in deterministic diagnostics.

          '
      relative_infectiousness_asymptomatic:
        mean: 0.5
        sd: 0.25
        note: 'Relative infectiousness of asymptomatic/subclinical infections compared
          to symptomatic cases. The exact ratio is not identified; the central registry
          assigns a broad weak-model prior.

          '
      infectious_duration_symptomatic:
        log_sd: 0.103
        note: 'Compatibility width only. The normalized Bayesian prior is centred
          at the literature model-fit median of 24 days and truncated to [14, 35]
          days in parameter_distributions.yaml.

          '
      infectious_duration_asymptomatic:
        log_sd: 0.3
        note: 'Weak modelling assumption; the central registry uses median 17.3 days
          and support [7, 28] because human data do not identify it.

          '
      fitness_R:
        min: 0.7
        max: 1.25
        mean: 1.0
        sd: 0.15
        note: 'Compatibility width alias. Production uses the central truncated lognormal
          weak-model prior (median 1.0, log-SD 0.15, support [0.70, 1.25]).

          '
      resistance_prevalence:
        floor_sd: 0.03
        note: 'Resistance prevalence is FIXED at the country-calibrated value during
          MCMC (not sampled). The country_resistance_timeline.csv provides well-constrained
          estimates for most countries. This eliminates a major source of multimodality
          without losing scientific information.

          '
      maternal_VE_sus:
        mean: 0.55
        sd: 0.12
        note: 'Prior for maternal antibody protection against infant infection. Centered
          on 0.55 using maternal Tdap effectiveness evidence for confirmed pertussis
          in infants younger than 2 months [36], which combines infection prevention
          and disease prevention. The infection-blocking component is a decomposed
          model assumption guided by maternal immunization effectiveness studies [10,12].
          SD of 0.12 allows exploration of [0.30, 0.80].

          '
      maternal_VE_sym:
        mean: 0.92
        sd: 0.05
        note: 'Prior for maternal antibody protection against symptomatic disease
          given infection. High confidence based on consistent estimates of VE against
          hospitalization (>90%) across US, UK, and Argentina studies [10,36,37].
          Narrow SD reflects strong evidence consensus.

          '
    stochastic_overlay:
      enabled: true
      random_seed: 20260511
      replicates_per_draw: 200
      superspreading_k: 10.0
      superspreading_k_min: 1.0
      household_mean_size: 3.5
      household_secondary_attack_rate: 0.8
      min_expected_count: 1.0
      credible_interval:
        low: 2.5
        high: 97.5
      k_sensitivity_values:
      - 5.0
      - 10.0
      - 20.0
      - 30.0
      - 50.0
      note: 'Negative-binomial observation overlay injecting two stochastic sources
        onto each deterministic posterior-predictive draw. Superspreading enters as
        an aggregate-scale NB2 dispersion k = 10 (empirical surveillance range 5-50;
        the calibration likelihood already uses dispersion = 50); this captures the
        tail of transmission heterogeneity (Lloyd-Smith et al. Nature 2005; Endo et
        al. 2020) that remains after aggregating individual-level offspring variability
        to country-year counts. Household clustering enters as the Ball, Mollison
        & Scalia-Tomba (1997) design effect DEFF = 1 + (m_bar - 1) * SAR with m_bar
        = 3.5 and pertussis household SAR = 0.8. Effective dispersion combines both
        via 1/k_eff = 1/k_ss + (DEFF - 1)/mu so household clustering dominates at
        small mu while superspreading dominates at large mu. Combined 95% PI is pooled
        over parameter draws and stochastic replicates; parameter- only and stochastic
        components are reported separately. The k_sensitivity_values sweep demonstrates
        how the combined PI width varies across the plausible range of aggregate dispersion
        (k=5 to k=50), making the assumption explicit and auditable. Addresses Lavine
        et al. (2011) sensitivity concern by making both parameter uncertainty and
        structural heterogeneity explicit and decomposable.

        '
