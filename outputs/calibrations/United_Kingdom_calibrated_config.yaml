      young_adult_18_39y: 0.22
      middle_adult_40_64y: 0.15
      elderly_65plus: 0.08
  treatment:
    treatment_rate_symptomatic: 0.025
    treatment_rate_asymptomatic: 0.002
    sensitive:
      infectious_duration_reduction: 0.2
      infectiousness_reduction: 0.15
    resistant:
      infectious_duration_reduction: 0.1
      infectiousness_reduction: 0.05
  PEP:
    coverage_household_contacts: 0.3
    effectiveness_sensitive: 0.823
    effectiveness_resistant: 0.1
    activation_prevalence: 2.0e-05
  reporting_rate_sensitivity:
    medium:
      multiplier: 1.0
      description: Baseline reporting rates as configured in country profiles.
    high:
      multiplier: 1.5
      description: Uniformly higher reporting (50% increase across all ages).
    low:
      multiplier: 0.5
      description: Uniformly lower reporting (50% decrease across all ages).
    age_biased:
      age_multipliers:
        infant_0_2m: 1.2
        infant_3_11m: 1.1
        child_1_4y: 0.9
        child_5_9y: 0.8
        adolescent_10_17y: 0.7
        young_adult_18_39y: 0.6
        middle_adult_40_64y: 0.5
        elderly_65plus: 0.6
      description: 'Age-biased reporting where infant ascertainment is slightly higher
        and adult/adolescent ascertainment is lower than baseline.

        '
    time_varying:
      multiplier: 1.0
      time_variation:
        start_multiplier: 0.5
        end_multiplier: 1.5
      description: 'Linearly improving reporting over the analysis period (e.g. due
        to increased awareness, better diagnostics, or expanded testing).

        '
    infant_high_adult_very_low:
      age_multipliers:
        infant_0_2m: 1.0
        infant_3_11m: 0.9
        child_1_4y: 0.6
        child_5_9y: 0.5
        adolescent_10_17y: 0.3
        young_adult_18_39y: 0.2
        middle_adult_40_64y: 0.15
        elderly_65plus: 0.2
      description: 'Strong age gradient: infant reporting near baseline but adolescent
        and adult reporting reduced to 3-5% absolute (consistent with Ontario capture-recapture:
        11% of age 1+ cases reported, and England/Wales notification efficiency of
        5-25% overall). This scenario tests whether the true infection burden in adults
        is substantially higher than reported cases suggest.

        '
    infant_moderate_adult_minimal:
      age_multipliers:
        infant_0_2m: 0.7
        infant_3_11m: 0.6
        child_1_4y: 0.5
        child_5_9y: 0.4
        adolescent_10_17y: 0.2
        young_adult_18_39y: 0.1
        middle_adult_40_64y: 0.08
        elderly_65plus: 0.1
      description: 'Extreme under-reporting scenario anchored to the lower end of
        literature estimates. Infant reporting at 35-42% (Ontario hospital study:
        37%), school-age at 2-5%, adults at 0.5-2.5%. Represents passive surveillance
        systems without active case-finding.

        '
    enhanced_surveillance:
      age_multipliers:
        infant_0_2m: 1.3
        infant_3_11m: 1.2
        child_1_4y: 1.4
        child_5_9y: 1.5
        adolescent_10_17y: 1.8
        young_adult_18_39y: 2.5
        middle_adult_40_64y: 2.5
        elderly_65plus: 2.0
      description: 'Enhanced surveillance scenario where improved diagnostics (PCR
        availability, point-of-care testing) increase ascertainment, particularly
        in older age groups. Represents the effect of active surveillance programs
        or outbreak investigations.

        '
    adult_focused_improvement:
      age_multipliers:
        infant_0_2m: 1.0
        infant_3_11m: 1.0
        child_1_4y: 1.0
        child_5_9y: 1.0
        adolescent_10_17y: 2.0
        young_adult_18_39y: 3.0
        middle_adult_40_64y: 3.0
        elderly_65plus: 2.5
      description: 'Scenario where adult/adolescent reporting improves substantially
        (e.g. through Tdap booster awareness campaigns, expanded testing guidelines
        for prolonged cough). Tests sensitivity of total burden estimates to adult
        ascertainment improvements.

        '
    china_passive_system:
      age_multipliers:
        infant_0_2m: 0.8
        infant_3_11m: 0.7
        child_1_4y: 0.5
        child_5_9y: 0.4
        adolescent_10_17y: 0.25
        young_adult_18_39y: 0.15
        middle_adult_40_64y: 0.12
        elderly_65plus: 0.15
      description: 'Calibrated to Yiwu active-surveillance study (China) which found
        community incidence of 108.3/100k vs passive surveillance estimates far below
        this. Represents the gap between active and passive surveillance in a middle-income
        setting.

        '
  baseline_vaccine_scenario: symptom_protective
  baseline_resistance_scenario: country_timeline
  baseline_country_profile: China
  fitness_grid:
    random_seed: 20260510
    fitness_R_values:
    - 0.7
    - 0.8
    - 0.85
    - 0.9
    - 0.95
    - 0.98
    - 1.0
    - 1.02
    - 1.05
    - 1.1
    - 1.15
    - 1.2
    - 1.25
    VE_inf_values:
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    description: 'Continuous macrolide-resistant strain fitness stress test crossed
      with plausible-to-upper-bound vaccine infectiousness effects. VE_inf is the
      reduction in onward infectiousness among infected vaccine-history origins, not
      protection against infection. The fitness grid now includes finer resolution
      around fitness_R = 1.0 (neutral) because epidemiological evidence from China
      (36% to >99% MRBP in 8 years), Japan (83-88% in 2024-2025), and international
      MT28 spread suggests the true fitness is near or above 1.0. Values below 0.85
      are retained for completeness but are increasingly inconsistent with observed
      resistance dynamics. VE_inf axis expanded from 5 to 11 uniform steps (0.05 increments)
      to improve heatmap resolution in Figure 3E/F panels.

      '
  bayesian_uncertainty:
    random_seed: 20260510
    publication_country_exclusions:
      South_Africa: 'Only three recent non-overlapping observation intervals are available,
        below the prespecified five-interval calibration/validation floor. Retain
        as an exploratory deterministic scenario, but exclude it from calibrated policy
        uncertainty until additional surveillance data or a separately justified external
        calibration model is supplied.

        '
    inference_structure: reference_structure_state_space_exact_importance_cut
    shared_structural_seed: 20260712
    n_chains: 4
    warmup: 0
    draws: 128
    thin: 1
    proposal_scale: 1.0
    smc_particles: 1024
    smc_ess_fraction: 0.65
    smc_move_steps: 4
    smc_max_stages: 100
    posterior_predictive_draws_per_country: 100
    dispersion: 50.0
    enable_time_varying_reporting: false
    likelihood_observation_frequency: annual
    require_calibrated_start: true
    state_space_importance:
      adaptation_candidate_count: 512
      adaptation_round_candidate_count: 512
      candidate_count: 1024
      max_adaptive_rounds: 2
      require_recommended_quality: true
      localized_mixture_enabled: true
