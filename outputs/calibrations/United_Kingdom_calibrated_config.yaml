    random_seed: 20260510
    fitness_R_values:
    - 0.7
    - 0.8
    - 0.85
    - 0.9
    - 0.95
    - 0.98
    - 1.0
    - 1.02
    - 1.05
    - 1.1
    - 1.15
    - 1.2
