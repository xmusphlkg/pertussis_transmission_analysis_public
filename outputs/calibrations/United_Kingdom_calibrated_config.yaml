  routine_vaccination:
    enabled: true
    target_relaxation_rate_per_year: 2.0
    max_daily_flow_fraction: 0.01
    note: 'Routine vaccination relaxes toward age-specific target origin distributions,
      but the daily flow from unvaccinated susceptibility is capped at 1% of the available
      unvaccinated susceptible pool to match the ODE implementation and avoid numerical
      overshoot.

      '
  initial_conditions:
    initial_exposed_per_100k: 1.5
    initial_infectious_per_100k: 0.6
