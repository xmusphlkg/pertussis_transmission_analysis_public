      derived from (analysis_end_date - analysis_start_date). Output rows include
      calendar_date/calendar_year. Calibration overrides these dates to the observed
      surveillance window so modelled and observed annual cases align by real calendar
      year, with reporting intervals split across calendar-year boundaries. Start
      date set to 2025-01-01 to allow short-term out-of-sample validation against
      2025 surveillance data before the forward projection period.

      '
